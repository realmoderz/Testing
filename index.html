<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Tasks To Unlock Link</title>

  <!-- Lightweight Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { yt: '#FF0000', tg: '#229ED9', ig: '#E1306C' }
          }
        }
      }
    };
  </script>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-interactive {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .glass-interactive:active {
      transform: scale(0.98);
    }

    .glass-completed {
      background: rgba(16, 185, 129, 0.12) !important;
      border-color: rgba(52, 211, 153, 0.4) !important;
    }
  </style>
</head>

<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 selection:bg-cyan-500 selection:text-black">

  <!-- TOP AD BANNER -->
  <script>
    atOptions = {
      'key' : '7ec14d4dbf15922518bb543fa461d221',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script src="https://bicea.org/22/7ec14d4dbf15922518bb543fa461d221"></script>

  <!-- MAIN CARD -->
  <main class="relative z-10 w-full max-w-md glass-panel rounded-3xl p-6 sm:p-7 my-auto">
    
    <!-- LOADING STATE -->
    <div id="loading-state" class="flex flex-col items-center justify-center py-10 space-y-3">
      <div class="w-10 h-10 rounded-full border-2 border-white/10 border-t-cyan-400 animate-spin"></div>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Retrieving Link Data...</p>
    </div>

    <!-- ERROR STATE -->
    <div id="error-state" class="hidden flex flex-col items-center text-center py-8 space-y-3">
      <div class="w-12 h-12 rounded-2xl glass-pill bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h2 class="text-base font-bold text-white">Access Error</h2>
      <p id="error-message" class="text-xs text-slate-400">Invalid link key or missing parameter.</p>
    </div>

    <!-- UNLOCK CONTENT -->
    <div id="content-state" class="hidden space-y-5">
      
      <div class="text-center space-y-1.5">
        <div class="inline-block mb-1">
          <div id="lock-badge" class="w-12 h-12 rounded-2xl glass-pill text-cyan-400 flex items-center justify-center text-lg">
            <i id="lock-icon" class="fa-solid fa-lock"></i>
          </div>
        </div>
        <h1 id="brand-title" class="text-lg font-extrabold text-white">Realmoderz</h1>
        <p class="text-[11px] text-slate-400">Complete required tasks below to unlock link</p>
      </div>

      <!-- PROGRESS -->
      <div class="glass-pill rounded-xl px-3.5 py-2.5 flex items-center justify-between text-xs font-semibold">
        <span class="text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          Tasks Progress
        </span>
        <span id="task-counter" class="font-mono text-cyan-400 font-bold">0 / 0</span>
      </div>

      <!-- TASKS CONTAINER -->
      <div id="tasks-container" class="space-y-2.5"></div>

      <!-- UNLOCK BUTTON -->
      <button
        id="unlock-btn"
        disabled
        class="w-full py-3.5 px-5 rounded-2xl font-black text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 opacity-40 cursor-not-allowed glass-pill text-slate-400"
      >
        <i class="fa-solid fa-lock text-xs"></i>
        <span>Unlock Target Link</span>
      </button>

    </div>
  </main>

  <!-- BOTTOM AD BANNER -->
  <script>
    atOptions = {
      'key' : '7ec14d4dbf15922518bb543fa461d221',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  </script>
  <script src="https://bicea.org/22/7ec14d4dbf15922518bb543fa461d221"></script>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_A-v2kRDBiry1iv1zC-Up3eMAvI1-NUs",
      authDomain: "realmoderzs.firebaseapp.com",
      databaseURL: "https://realmoderzs-default-rtdb.firebaseio.com",
      projectId: "realmoderzs",
      storageBucket: "realmoderzs.firebasestorage.app",
      messagingSenderId: "879115715712",
      appId: "1:879115715712:web:93b9584c6ecc7bbf951265"
    };

    let destinationUrl = "";
    let tasksList = [];
    let linkId = "";
    let activeTaskIndex = null;
    let taskStartTime = 0;
    const completedTasks = new Set();

    const platformPresets = {
      youtube: { icon: "fa-brands fa-youtube", color: "text-red-500", text: "Subscribe YouTube", badge: "YouTube" },
      telegram: { icon: "fa-brands fa-telegram", color: "text-sky-400", text: "Join Telegram", badge: "Telegram" },
      instagram: { icon: "fa-brands fa-instagram", color: "text-pink-400", text: "Follow Instagram", badge: "Instagram" },
      default: { icon: "fa-solid fa-link", color: "text-cyan-400", text: "Visit Link", badge: "Task" }
    };

    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      linkId = urlParams.get("id");

      if (!linkId) {
        renderData({
          brandName: "Realmoderz",
          destinationLink: "https://google.com",
          tasks: [
            { platform: "youtube", title: "Subscribe to YouTube", url: "https://youtube.com" },
            { platform: "instagram", title: "Follow on Instagram", url: "https://instagram.com" },
            { platform: "telegram", title: "Join Telegram Channel", url: "https://t.me" }
          ]
        });
        return;
      }

      const savedProgress = localStorage.getItem(`sub2unlock_${linkId}`);
      if (savedProgress) {
        try {
          JSON.parse(savedProgress).forEach(idx => completedTasks.add(idx));
        } catch(e) {}
      }

      try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const linkRef = ref(db, `links/${linkId}`);
        const snapshot = await get(linkRef);

        if (!snapshot.exists()) {
          showError("Link ID not found in database.");
          return;
        }

        renderData(snapshot.val());
      } catch (err) {
        console.error(err);
        showError("Database connection failed.");
      }
    }

    function showError(msg) {
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("content-state").classList.add("hidden");
      document.getElementById("error-state").classList.remove("hidden");
      document.getElementById("error-message").textContent = msg;
    }

    function renderData(data) {
      destinationUrl = data.destinationLink;
      tasksList = data.tasks || [];
      document.getElementById("brand-title").textContent = data.brandName || "Realmoderz";

      updateProgress();
      renderTasks();

      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("content-state").classList.remove("hidden");

      checkAllFinished();
    }

    function renderTasks() {
      const container = document.getElementById("tasks-container");
      container.innerHTML = "";

      tasksList.forEach((task, index) => {
        const platform = (task.platform || "").toLowerCase();
        const conf = platformPresets[platform] || platformPresets.default;
        const isDone = completedTasks.has(index);

        const btn = document.createElement("button");
        btn.className = `w-full p-3 rounded-2xl glass-interactive flex items-center justify-between ${
          isDone ? "glass-completed cursor-default" : "cursor-pointer"
        }`;

        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-9 h-9 rounded-xl flex items-center justify-center text-base bg-white/10 ${conf.color}">
              <i class="${conf.icon}"></i>
            </span>
            <div class="text-left">
              <p class="text-xs font-bold ${isDone ? 'text-emerald-300 line-through' : 'text-white'}">
                ${task.title || conf.text}
              </p>
              <span class="text-[9px] uppercase font-bold text-slate-400">${conf.badge}</span>
            </div>
          </div>
          <div id="status-slot-${index}">
            ${isDone ? '<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>' : '<i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>'}
          </div>
        `;

        if (!isDone) {
          btn.onclick = () => onTaskClick(task, index);
        }

        container.appendChild(btn);
      });
    }

    function onTaskClick(task, index) {
      if (completedTasks.has(index)) return;

      activeTaskIndex = index;
      taskStartTime = Date.now();

      const slot = document.getElementById(`status-slot-${index}`);
      if (slot) {
        slot.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-cyan-400 text-xs"></i>';
      }

      if (task.url) {
        window.open(task.url, "_blank");
      }
    }

    window.addEventListener("focus", () => {
      if (activeTaskIndex !== null) {
        const timeSpent = (Date.now() - taskStartTime) / 1000;
        const index = activeTaskIndex;
        activeTaskIndex = null;

        if (timeSpent >= 5) {
          completedTasks.add(index);
          if (linkId) {
            localStorage.setItem(`sub2unlock_${linkId}`, JSON.stringify(Array.from(completedTasks)));
          }
          updateProgress();
          renderTasks();
          checkAllFinished();
        } else {
          renderTasks();
          alert("⚠️ Task Verification Failed!\n\nPlease stay on the social media page for at least 5-6 seconds to complete the task.");
        }
      }
    });

    function updateProgress() {
      document.getElementById("task-counter").textContent = `${completedTasks.size} / ${tasksList.length}`;
    }

    function checkAllFinished() {
      if (completedTasks.size === tasksList.length && tasksList.length > 0) {
        const unlockBtn = document.getElementById("unlock-btn");
        unlockBtn.disabled = false;
        unlockBtn.className = "w-full py-3.5 px-5 rounded-2xl font-black text-xs uppercase tracking-wider text-slate-950 bg-gradient-to-r from-emerald-400 to-cyan-400 shadow-lg shadow-emerald-500/20 active:scale-95 transition-all cursor-pointer";
        unlockBtn.innerHTML = `<span>Get Unlock Link</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;

        unlockBtn.onclick = () => {
          if (destinationUrl) window.location.href = destinationUrl;
        };
      }
    }

    init();
  </script>
</body>
</html>
