  <!-- APPLICATION LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_A-v2kRDBiry1iv1zC-Up3eMAvI1-NUs",
      authDomain: "realmoderzs.firebaseapp.com",
      databaseURL: "https://realmoderzs-default-rtdb.firebaseio.com",
      projectId: "realmoderzs",
      storageBucket: "realmoderzs.firebasestorage.app",
      messagingSenderId: "879115715712",
      appId: "1:879115715712:web:93b9584c6ecc7bbf951265"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const keyIdParam = (urlParams.get("keyId") || urlParams.get("id") || "").trim();
    const isVerified = (urlParams.get("verified") || "").toLowerCase() === "true";

    async function init() {
      if (!keyIdParam) {
        showError("Missing Key ID in URL parameters.");
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const keyRef = ref(db, `keys/${keyIdParam}`);

        onValue(keyRef, (snapshot) => {
          if (snapshot.exists()) {
            renderKeyPage(snapshot.val());
          } else {
            showError("Key does not exist or has expired.");
          }
        }, (err) => {
          showError("Database connection failed: " + err.message);
        });
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("content-state").classList.add("hidden");
      document.getElementById("error-state").classList.remove("hidden");
      document.getElementById("error-message").textContent = msg;
    }

    function renderKeyPage(data) {
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("content-state").classList.remove("hidden");

      document.getElementById("key-title").textContent = data.keyTitle || "Access Key";

      if (data.keyImage) {
        document.getElementById("key-photo-img").src = data.keyImage;
        document.getElementById("key-photo-container").classList.remove("hidden");
      }

      if (data.summary) {
        document.getElementById("key-summary-text").textContent = data.summary;
        document.getElementById("key-summary-box").classList.remove("hidden");
      }

      const isExpired = Date.now() > data.expiresAt;
      const statusBadge = document.getElementById("key-status-badge");
      const expiryText = document.getElementById("key-expiry-text");

      if (isExpired) {
        statusBadge.textContent = "Expired";
        statusBadge.className = "text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
        expiryText.textContent = "Expired on " + new Date(data.expiresAt).toLocaleDateString();
      } else {
        statusBadge.textContent = "Active";
        statusBadge.className = "text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        expiryText.textContent = "Expires: " + new Date(data.expiresAt).toLocaleDateString();
      }

      // If no shortener URL provided OR user is verified, show key directly
      if (!data.shortenerUrl || isVerified) {
        document.getElementById("shortener-gate-box").classList.add("hidden");
        document.getElementById("key-unveiled-box").classList.remove("hidden");
        document.getElementById("key-code-display").textContent = data.keyCode || "ERROR";
      } else {
        document.getElementById("shortener-gate-box").classList.remove("hidden");
        document.getElementById("key-unveiled-box").classList.add("hidden");

        const unlockBtn = document.getElementById("unlock-link-btn");
        unlockBtn.onclick = () => {
          window.location.href = data.shortenerUrl;
        };
      }
    }

    document.getElementById("copy-key-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(document.getElementById("key-code-display").textContent.trim());
      const btn = document.getElementById("copy-key-btn");
      btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
      setTimeout(() => {
        btn.innerHTML = `<i class="fa-solid fa-copy"></i> <span>Copy</span>`;
      }, 2000);
    });

    init();
  </script>
